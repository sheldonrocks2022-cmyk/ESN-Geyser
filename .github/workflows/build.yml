name: ESN Geyser Build

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: esn-geyser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-spigot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout ESN-Geyser
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build ESN Geyser Spigot
        run: ./gradlew :spigot:build --stacktrace
        env:
          BUILD_NUMBER: "${{ github.run_number }}"

      - name: Rename ESN Geyser JAR
        run: |
          test -f bootstrap/spigot/build/libs/Geyser-Spigot.jar
          cp bootstrap/spigot/build/libs/Geyser-Spigot.jar "bootstrap/spigot/build/libs/ESN GEYSER.jar"
          ls -lh "bootstrap/spigot/build/libs/ESN GEYSER.jar"

      - name: Upload DaTHost-ready JAR
        uses: actions/upload-artifact@v4
        with:
          name: ESN-GEYSER
          path: "bootstrap/spigot/build/libs/ESN GEYSER.jar"
          if-no-files-found: error
          retention-days: 30
