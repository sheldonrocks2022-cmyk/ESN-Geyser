name: ESN Geyser Network Build

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: esn-geyser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-network:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout ESN-Geyser
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build ESN Geyser for Paper and Velocity
        run: ./gradlew :spigot:build :velocity:build --stacktrace
        env:
          BUILD_NUMBER: "${{ github.run_number }}"

      - name: Validate built platform JARs
        shell: bash
        run: |
          set -euo pipefail

          SPIGOT_JAR="bootstrap/spigot/build/libs/Geyser-Spigot.jar"
          VELOCITY_JAR="bootstrap/velocity/build/libs/Geyser-Velocity.jar"

          test -s "$SPIGOT_JAR"
          test -s "$VELOCITY_JAR"

          jar tf "$SPIGOT_JAR" > /tmp/esn-spigot-jar.txt
          jar tf "$VELOCITY_JAR" > /tmp/esn-velocity-jar.txt

          grep -q "org/geysermc/geyser/platform/spigot/GeyserSpigotMain.class" /tmp/esn-spigot-jar.txt
          grep -q "org/geysermc/geyser/platform/velocity/GeyserVelocityMain.class" /tmp/esn-velocity-jar.txt

          cp "$SPIGOT_JAR" "bootstrap/spigot/build/libs/ESN GEYSER.jar"
          cp "$VELOCITY_JAR" "bootstrap/velocity/build/libs/ESN GEYSER VELOCITY.jar"

          test -s "bootstrap/spigot/build/libs/ESN GEYSER.jar"
          test -s "bootstrap/velocity/build/libs/ESN GEYSER VELOCITY.jar"

          ls -lh "bootstrap/spigot/build/libs/ESN GEYSER.jar"
          ls -lh "bootstrap/velocity/build/libs/ESN GEYSER VELOCITY.jar"

      # Store one network bundle instead of three overlapping copies.
      - name: Upload ESN network JARs
        uses: actions/upload-artifact@v4
        with:
          name: ESN-GEYSER-NETWORK
          path: |
            bootstrap/spigot/build/libs/ESN GEYSER.jar
            bootstrap/velocity/build/libs/ESN GEYSER VELOCITY.jar
          compression-level: 9
          if-no-files-found: error
          retention-days: 7
